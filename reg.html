<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Login</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    <h1>Create Account</h1>
   <section class="form">
    <div>
        <h2>Name</h2>
        <input class="names" type="text" placeholder="Enter your name">
    </div>

    <div>
        <h2>Email</h2>
        <input  class="emails"   type="email" placeholder="Enter the email">
    </div>

    <div>
        <h2>Password</h2>
        <input  class="passwords "   type="password" placeholder="Enter the password">
    </div>

    <button class="btn">Register</button>
   </section>
    
   <script src="reg.js"></script>
</body>
</html>
