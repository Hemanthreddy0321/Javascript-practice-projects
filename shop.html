<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Shopping</title>
    <link rel="stylesheet" href="shop.css">
</head>
<body>

    <h1>My Store</h1>
   <section class="box">
    <div>
        <img class="img1" src="headphoes.png">
        <h2 class="head1">Headphones</h2>
        <h2 class="price1">₹1,000</h2> 
        <button class="add1">Add to Cart</button>
        <button class="btn1">Buy</button>


    </div>
    <div>
        <img class="img2" src="mouse.png">
        <h2 class="head2">Mouse</h2>
        <h2 class="price2">₹500</h2>
        <button class="add2">Add to Cart</button>
        <button class="btn2">Buy</button>

     

    </div>
    <div>
        <img class="img3" src="keyboard.png">
        <h2 class="head3">Keyboard</h2>
        <h2 class="price3">₹1,500</h2>
        <button class="add3">Add to Cart</button>
        <button class="btn3">Buy</button>


    </div>
    <div>
        <img class="img4" src="watch.png">
        <h2 class="head4">Smartwatch</h2>
        <h2 class="price4">₹2,000</h2>
        <button class="add4">Add to Cart</button>
        <button class="btn4">Buy</button>


    </div>
   </section>

   <div class="cart">
    <h2>Your Cart</h2>
    <p>Added products will appear here, with their quantities, prices, and a running total.</p>
    <h2 class="total">Total ₹0</h2>
    <div class="cartitems"></div>
    <button class="clear">Clear</button>
   </div>

   <p class="buymessage"></p>

   <script src="shop.js"></script>


    
</body>
</html>
